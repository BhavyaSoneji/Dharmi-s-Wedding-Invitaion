<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Monogram mark. A gavaksha (cusped Indian arch) drawn as a single gold
    stroke on the site's ink ground.

    Vector rather than raster because it stays sharp at every size a browser
    will ask for it — 16px tab, 32px bookmark bar, 180px home screen — from one
    1KB file, where the previous 64x64 PNG had to be replaced at each size.
  -->
  <rect width="64" height="64" rx="8" fill="#2b1a19" />
  <path
    d="M32 9c-11.6 0-21 9.4-21 21v22h42V30c0-11.6-9.4-21-21-21z"
    fill="none"
    stroke="#c6a66a"
    stroke-width="2.5"
  />
  <path
    d="M22 52V30a10 10 0 0 1 20 0v22"
    fill="none"
    stroke="#c6a66a"
    stroke-width="1.25"
    opacity="0.5"
  />
  <circle cx="32" cy="38" r="3.25" fill="#c6a66a" />
</svg>